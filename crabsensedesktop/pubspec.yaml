name: crab_farm_monitor_desktop
description: CrabFarm Monitor - Desktop aquaculture monitoring app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  flutter_dotenv: ^5.2.1
  http: ^1.2.2
  file_picker: ^8.1.4
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.10
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo.png
    - assets/images/login_background.png
    - assets/images/login/Nen_Login.png
    - assets/images/login/Sologan_Login.png
    - assets/images/login/background_right.png
    - assets/images/login/slogan_right_tv.png
    - assets/images/login/slogan_right-en.png
    - assets/images/background_light.png
    - assets/images/background_tabslidebar.png
    - assets/images/background_chao_user.png
    - assets/images/maps.png
    - assets/images/ai_assistant_mascot.png
    - assets/icon_tab/
