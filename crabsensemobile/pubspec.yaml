name: crabsensemobile
description: "CrabSense Mobile - Enterprise IoT mobile solution for smart crab farming operations"
publish_to: 'none' # Private package

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+2

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  fpdart: ^1.1.0

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  
  # State Management
  flutter_riverpod: ^2.5.1
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Navigation with Deep Linking
  go_router: ^13.0.0
  
  # Local Storage - SQLite
  drift: ^2.14.0
  # sqlite3_flutter_libs excluded from web build — use conditional in pubspec
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Secure Storage
  flutter_secure_storage: ^9.0.0
  
  # Local Storage - Key-Value
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Networking with Interceptors
  dio: ^5.4.0
  
  # HTTP Client (for simple requests)
  http: ^1.6.0
  
  # Camera & Media
  camera: ^0.10.5+5
  mobile_scanner: ^7.4.0
  video_compress: ^3.1.2
  image_picker: ^1.0.4
  
  # Push Notifications
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^17.2.1
  firebase_core: ^3.0.0
  
  # Permissions
  permission_handler: ^11.2.0
  
  # Biometric Authentication
  local_auth: ^2.1.8
  
  # Connectivity
  connectivity_plus: ^5.0.2
  workmanager: ^0.9.0+3
  
  # Date & Time Formatting
  intl: ^0.20.2
  
  # Charts & Visualization
  fl_chart: ^0.66.0
  
  # JSON Serialization (annotations only, generators added to dev_dependencies when needed)
  json_annotation: ^4.12.0
  
  # Dependency Injection
  get_it: ^7.6.4
  
  # Cached Network Images
  cached_network_image: ^3.3.0
  
  # Pull to Refresh
  pull_to_refresh: ^2.0.0
  
  # Location Services
  geolocator: ^11.0.0
  
  # Utilities
  logger: ^2.0.2+1
  rxdart: ^0.27.7
  dartz: ^0.10.1
  uuid: ^4.3.3
  
  # Cryptographic Functions
  crypto: ^3.0.3
  share_plus: ^12.0.2
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  firebase_auth: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_crashlytics: ^4.0.0
  drift_flutter: ^0.2.8
  
  # Error Tracking (optional)
  # sentry_flutter: ^7.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting & Code Quality
  flutter_lints: ^6.0.0
  
  # Code Generation (add when needed)
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  
  # Drift code generation
  drift_dev: ^2.14.0
  
  # Testing
  bloc_test: ^9.1.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    
  # Fonts - Inter font family for Material Design 3
