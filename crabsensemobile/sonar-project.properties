# SonarQube — CrabSense Mobile (Flutter)
# Chạy khi SonarQube server đang listen (mặc định http://localhost:9000):
#
#   sonar-scanner
#
# Hoặc Docker scanner (từ thư mục crabsensemobile):
#   docker run --rm -e SONAR_HOST_URL="http://host.docker.internal:9000" ^
#     -e SONAR_TOKEN="<token>" -v "%cd%:/usr/src" sonarsource/sonar-scanner-cli
#
sonar.projectKey=crabsense-mobile
sonar.projectName=CrabSense Mobile
sonar.projectVersion=1.0.0

sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Flutter/Dart: dùng sonar-flutter / community dart plugin nếu có.
# Loại trừ generated & tooling.
sonar.exclusions=**/generated/**,**/*.g.dart,**/*.freezed.dart,**/l10n/**,tools/**

# Security-focused quality expectations (document for Quality Gate):
# - Security Rating = A (0 vulnerabilities)
# - Security Hotspots Reviewed = 100%
# - Reliability Rating = A
# - Maintainability Rating = A
# - Coverage >= 80% (hiện ~95.5% theo dashboard)
# - Duplications < 3%
